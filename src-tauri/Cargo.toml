[package]
name = "ltools"
version = "0.1.6"
description = "A local-first Windows productivity tool"
authors = []
edition = "2021"

[lib]
name = "ltools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
arboard = "3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
time = { version = "0.3.54", features = ["serde"] }
thiserror = "2.0.19"
zip = "8.6.0"
image = "0.25.10"
sha2 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
